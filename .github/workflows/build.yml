name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Test touch mapping and calibration
        run: pio test -e native
      - name: Build all board examples
        run: pio run -e display_only -e touch_demo -e touch_calibration
