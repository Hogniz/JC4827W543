[platformio]
default_envs = touch_demo

; Explicit upstream release: Arduino-ESP32 3.0.7 / ESP-IDF 5.1.4.
; Do not replace this with an unversioned `espressif32` installation.
[board]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9

[env:touch_demo]
extends = board
build_src_filter = +<Board.cpp> +<main.cpp>

[env:display_only]
extends = board
build_flags = ${board.build_flags} -D STARTER_TOUCH_ENABLED=0
build_src_filter = +<Board.cpp> +<display_only.cpp>

[env:touch_calibration]
extends = board
build_src_filter = +<Board.cpp> +<calibration.cpp>

[env:native]
platform = native@1.2.1
test_framework = unity
test_filter = test_touch_math
build_flags = -std=c++11 -I include
lib_deps = throwtheswitch/Unity@2.6.1
